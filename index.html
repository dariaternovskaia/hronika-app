<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хроника</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="container">
            <h1 style="text-align: center; margin-bottom: 16px; font-weight: 300; letter-spacing: 2px; color: #7a8ba8;">Хроника</h1>
            <nav class="nav">
                <button class="active" data-screen="calendar">Календарь</button>
                <button data-screen="studies">Учебные материалы</button>
                <button data-screen="gallery">Фото</button>
                <button data-screen="books">Читательский дневник</button>
                <button data-screen="movies">Кинодневник</button>
                <button data-screen="logout">Выход</button>
            </nav>
        </div>

        <main class="container">
            <section id="screenCalendar" class="screen active">
                <div id="calendar"></div>
            </section>

            <section id="screenStudies" class="screen">
                <div class="studies-header">
                    <h2>Учебные материалы</h2>
                </div>
                <div id="studyContent" class="studies-content"></div>
            </section>

            <section id="screenGallery" class="screen">
                <div class="gallery-header">
                    <h2>Фото</h2>
                </div>
                <div id="photoContent" class="gallery-grid"></div>
            </section>

            <section id="screenBooks" class="screen">
                <div class="diary-header">
                    <h2>Читательский дневник</h2>
                </div>
                <div id="readerContent" class="diary-list"></div>
            </section>

            <section id="screenMovies" class="screen">
                <div class="diary-header">
                    <h2>Кинодневник</h2>
                </div>
                <div id="cinemaContent" class="diary-list"></div>
            </section>

            <section id="screenLogout" class="screen">
                <h2 style="text-align: center; color: #7a8ba8; margin-top: 40px;">Вы вышли из приложения</h2>
            </section>
        </main>
    </div>

    <!-- МОДАЛКА ЧЕЛЛЕНДЖА -->
    <div id="challengeModal" class="modal-overlay">
        <div class="modal-card challenge-modal-card">
            <h2 id="challengeModalTitle">Новый челлендж</h2>
            
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="chName" placeholder="Например: Читать 30 страниц в день" />
            </div>

            <div class="form-group">
                <label>Комментарий</label>
                <textarea id="chComment" placeholder="Описание челленджа..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Дата начала</label>
                    <input type="date" id="chStartDate" />
                </div>
                <div class="form-group">
                    <label>Дата окончания</label>
                    <input type="date" id="chEndDate" />
                    <label class="checkbox-label">
                        <input type="checkbox" id="chNoEndDate" />
                        Без даты окончания
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Темп выполнения</label>
                <div class="pace-row">
                    <select id="chUnit">
                        <option value="pages">страницы</option>
                        <option value="lessons">занятия</option>
                        <option value="tasks">уроки</option>
                        <option value="exercises">задания</option>
                        <option value="custom">своё</option>
                    </select>
                    <input type="text" id="chCustomUnit" placeholder="Единица измерения" style="display:none;" />
                </div>
                <div class="pace-row">
                    <input type="number" id="chTotal" placeholder="Всего" min="0" />
                    <input type="number" id="chPerSession" placeholder="За раз" min="0" />
                    <select id="chFrequency">
                        <option value="daily">ежедневно</option>
                        <option value="weekly">еженедельно</option>
                        <option value="custom">своя частота</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Тема</label>
                    <select id="chTopic">
                        <option value="math">Математика</option>
                        <option value="philosophy">Философия</option>
                        <option value="linguistics">Языкознание</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Тип</label>
                    <select id="chType">
                        <option value="books">Книги</option>
                        <option value="courses">Курсы</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Цвет</label>
                <input type="color" id="chColor" value="#fde68a" />
            </div>

            <div class="modal-actions">
                <button id="deleteChallengeBtn" class="btn-secondary" style="display:none;">Удалить</button>
                <button id="cancelChallengeBtn" class="btn-secondary">Отмена</button>
                <button id="saveChallengeBtn" class="btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/studies.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/books.js"></script>
    <script src="js/movies.js"></script>
    <script src="js/terabox.js"></script>
</body>
</html>
