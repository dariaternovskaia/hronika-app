<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хроника жизни</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Экран входа -->
    <div id="loginScreen" class="login-screen">
        <h1>Хроника</h1>
        <p class="subtitle">Войдите в TeraBox для синхронизации</p>
        <input type="text" id="loginEmail" placeholder="Email или телефон">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <div id="loginError" class="error"></div>
        <div class="hint">Данные сохраняются в TeraBox, а не в браузере</div>
    </div>

    <!-- Основное приложение -->
    <div id="appScreen" style="display:none;">
        <div class="container">
            <!-- Навигация -->
            <nav class="nav" id="mainNav">
                <button class="active" data-screen="calendar">Календарь</button>
                <button data-screen="year">Год</button>
                <button data-screen="gallery">Фото</button>
                <button data-screen="challenges">Челленджи</button>
                <button data-screen="logout" id="logoutBtn">Выход</button>
            </nav>

            <!-- Календарь (месяц) -->
            <div id="screenCalendar" class="screen active">
                <div class="calendar-header">
                    <h2 id="calendarTitle">Август 2026</h2>
                    <div class="month-nav">
                        <button id="prevMonth">‹</button>
                        <button id="nextMonth">›</button>
                    </div>
                </div>
                <div id="challengeProgress" class="challenge-progress">
                    <h3>Прогресс за месяц</h3>
                    <div id="progressContainer"></div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="hint">Кликните на день, чтобы открыть</div>
            </div>

            <!-- Глобальный календарь (год) -->
            <div id="screenYear" class="screen">
                <div class="year-header">
                    <h2 id="yearTitle">2026</h2>
                    <div class="year-nav">
                        <button id="prevYear">‹</button>
                        <button id="nextYear">›</button>
                    </div>
                </div>
                <div class="filters">
                    <span>Фильтры:</span>
                    <button class="filter-btn active" data-filter="all">Все</button>
                    <button class="filter-btn" data-filter="matematika">Математика</button>
                    <button class="filter-btn" data-filter="filosofiya">Философия</button>
                    <button class="filter-btn" data-filter="yazyki">Языки</button>
                    <button class="filter-btn" data-filter="books">Книги</button>
                    <button class="filter-btn" data-filter="courses">Курсы</button>
                </div>
                <div id="yearCalendar" class="year-calendar"></div>
            </div>

            <!-- Галерея фото -->
            <div id="screenGallery" class="screen">
                <div class="gallery-header">
                    <h2>Фото</h2>
                    <button id="addPhotoBtn">+ Добавить</button>
                </div>
                <div id="galleryGrid" class="gallery-grid"></div>
            </div>

            <!-- Управление челленджами -->
            <div id="screenChallenges" class="screen">
                <div class="challenges-header">
                    <h2>Челленджи</h2>
                    <button id="addChallengeBtn">+ Добавить</button>
                </div>
                <div id="challengesList" class="challenges-list"></div>
            </div>

            <!-- Страничка дня -->
            <div id="screenDay" class="screen">
                <div class="day-page-header">
                    <button class="back-btn" id="dayBackBtn">← Назад</button>
                    <h2 id="dayTitle">18 августа 2026</h2>
                    <button class="save-btn" id="daySaveBtn">Сохранить</button>
                </div>
                <!-- Рекомендации -->
                <div id="recommendations" class="recommendations"></div>
                <!-- Список дел -->
                <div class="todo-section">
                    <div class="todo-header">
                        <h3>Дела</h3>
                        <button class="add-todo-btn" id="addTodoBtn">+ Добавить</button>
                        <button class="add-event-btn" id="addEventBtn">+ Событие</button>
                    </div>
                    <div id="todoList"></div>
                </div>
                <!-- Заметки -->
                <div class="notes-section">
                    <h3>Заметки</h3>
                    <textarea id="dayNotes" placeholder="Ваши заметки за этот день..."></textarea>
                </div>
                <!-- Файлы дня -->
                <div class="day-files-section">
                    <h3>Файлы дня</h3>
                    <div id="dayFilesList" class="file-list"></div>
                    <div class="upload-area">
                        <button id="uploadDayFileBtn">Загрузить файл ко дню</button>
                        <button id="uploadDayPhotoBtn">Загрузить фото ко дню</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script src="js/terabox.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/challenges.js"></script>
    <script src="js/todos.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
