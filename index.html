<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хроника — личный дневник</title>
    
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="app-container">
        <!-- ШАПКА -->
        <header class="app-header">
            <h1>📅 Хроника</h1>
            <div class="header-actions">
                <button class="icon-btn" id="todayBtn" title="Сегодня">📌</button>
                <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
            </div>
        </header>

        <!-- ОСНОВНАЯ СЕТКА -->
        <div class="main-grid">
            
            <!-- ЛЕВАЯ КОЛОНКА: КАЛЕНДАРЬ -->
            <section class="calendar-section">
                <div class="section-header">
                    <h2>Календарь</h2>
                    <div class="month-nav">
                        <button class="nav-btn" id="prevMonth">←</button>
                        <span id="currentMonthLabel">Январь 2026</span>
                        <button class="nav-btn" id="nextMonth">→</button>
                    </div>
                </div>
                <div id="calendar" class="calendar-table">
                    <!-- сюда рендерится календарь через calendar.js -->
                </div>
            </section>

            <!-- ПРАВАЯ КОЛОНКА: ДНЕВНИК И ДЕЛА -->
            <aside class="sidebar">
                <!-- Блок ДНЕВНИК -->
                <section class="diary-section">
                    <div class="section-header">
                        <h2>📖 Дневник</h2>
                        <button class="add-btn" id="addDiaryBtn">+</button>
                    </div>
                    <div id="diaryList" class="diary-list">
                        <!-- сюда рендерится список дневников через diary.js -->
                    </div>
                </section>

                <!-- Блок УЧЁБА -->
                <section class="study-section">
                    <div class="section-header">
                        <h2>📚 Учёба</h2>
                        <button class="add-btn" id="addStudyBtn">+</button>
                    </div>
                    <div id="studyList" class="study-list">
                        <!-- сюда рендерится список задач через study.js -->
                    </div>
                </section>
            </aside>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО (для челленджей) -->
    <div id="modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Челлендж</h2>
            <span class="badge" id="modalBadge">🎯</span>
            <p id="modalDesc">Описание</p>
            <div class="dates" id="modalDates">с 1 января по 15 января</div>
            <button class="modal-close" id="modalCloseBtn">Закрыть</button>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ СКРИПТЫ (в правильном порядке) -->
    <script src="js/calendar.js"></script>
    <script src="js/diary.js"></script>
    <script src="js/study.js"></script>
</body>
</html>
