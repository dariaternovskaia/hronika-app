<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хроника</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- ШАПКА С НАВИГАЦИЕЙ (исправлено под реальный app.js) -->
        <div class="container">
            <h1 style="text-align: center; margin-bottom: 16px; font-weight: 300; letter-spacing: 2px; color: #7a8ba8;">Хроника</h1>
            <nav class="nav">
                <button class="active" data-screen="calendar">Календарь</button>
                <button data-screen="studies">Учебные материалы</button>
                <button data-screen="gallery">Фото</button>
                <button data-screen="books">Читательский дневник</button>
                <button data-screen="movies">Кинодневник</button>
                <button data-screen="logout">Выход</button>
            </nav>
        </div>

        <!-- КОНТЕЙНЕРЫ ДЛЯ РАЗДЕЛОВ (ID должны совпадать с логикой app.js) -->
        <main class="container">
            <section id="screenCalendar" class="screen active">
                <div id="calendar"></div>
            </section>

            <section id="screenStudies" class="screen">
                <div class="studies-header">
                    <h2>Учебные материалы</h2>
                </div>
                <div id="studyContent" class="studies-content"></div>
            </section>

            <section id="screenGallery" class="screen">
                <div class="gallery-header">
                    <h2>Фото</h2>
                </div>
                <div id="photoContent" class="gallery-grid"></div>
            </section>

            <section id="screenBooks" class="screen">
                <div class="diary-header">
                    <h2>Читательский дневник</h2>
                </div>
                <div id="readerContent" class="diary-list"></div>
            </section>

            <section id="screenMovies" class="screen">
                <div class="diary-header">
                    <h2>Кинодневник</h2>
                </div>
                <div id="cinemaContent" class="diary-list"></div>
            </section>

            <section id="screenLogout" class="screen">
                <h2 style="text-align: center; color: #7a8ba8; margin-top: 40px;">Вы вышли из приложения</h2>
            </section>
        </main>
    </div>

    <!-- МОДАЛКА ДЛЯ ЧЕЛЛЕНДЖЕЙ -->
    <div id="modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Челлендж</h2>
            <span class="badge" id="modalBadge">Задача</span>
            <p id="modalDesc">Описание</p>
            <div class="dates" id="modalDates"></div>
            <button class="modal-close" id="modalCloseBtn">Закрыть</button>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ СКРИПТЫ (реальные имена файлов из твоего репозитория) -->
    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/studies.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/books.js"></script>
    <script src="js/movies.js"></script>
    <script src="js/terabox.js"></script>
</body>
</html>
