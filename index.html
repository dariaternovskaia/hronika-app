<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хроника</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="container">
            <h1 style="text-align: center; margin-bottom: 16px; font-weight: 300; letter-spacing: 2px; color: #7a8ba8;">Хроника</h1>
            <nav class="nav" style="position:relative;">
                <button class="active" data-screen="calendar">Календарь</button>
                <button data-screen="studies">Учебные материалы</button>
                <button data-screen="gallery">Фото</button>
                <button data-screen="books">Читательский дневник</button>
                <button data-screen="movies">Кинодневник</button>
                <button data-screen="logout">Выход</button>
                <button id="syncBtn" onclick="showSyncMenu()" style="background:#2a6a4a;color:#e8edf5;border:none;border-radius:10px;padding:10px 14px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:4px;font-weight:500;">💾 Синхр.</button>
            </nav>
        </div>

        <main class="container">
            <section id="screenCalendar" class="screen active">
                <div id="calendar"></div>
            </section>

            <section id="screenStudies" class="screen">
                <div class="studies-header"><h2>Учебные материалы</h2></div>
                <div id="studyContent" class="studies-content"></div>
            </section>

            <section id="screenGallery" class="screen">
                <div class="gallery-header"><h2>Фото</h2></div>
                <div id="photoContent"></div>
            </section>

            <section id="screenBooks" class="screen">
                <div class="diary-header"><h2>Читательский дневник</h2></div>
                <div id="readerContent" class="diary-list"></div>
            </section>

            <section id="screenMovies" class="screen">
                <div class="diary-header"><h2>Кинодневник</h2></div>
                <div id="cinemaContent" class="diary-list"></div>
            </section>

            <section id="screenLogout" class="screen">
                <h2 style="text-align: center; color: #7a8ba8; margin-top: 40px;">Вы вышли из приложения</h2>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/studies.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/books.js"></script>
    <script src="js/movies.js"></script>
    <script src="js/terabox.js"></script>
    
    <script>
        window.addEventListener('load', () => {
            setTimeout(showSyncReminder, 2000);
        });
    </script>
</body>
</html>
