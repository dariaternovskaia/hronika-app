<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хроника жизни</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Экран входа -->
    <div id="loginScreen" class="login-screen">
        <h1>Хроника</h1>
        <p class="subtitle">Войдите в TeraBox для синхронизации</p>
        <input type="text" id="loginEmail" placeholder="Email или телефон">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <button id="loginBtn">Войти</button>
        <div id="loginError" class="error"></div>
        <div class="hint">Данные сохраняются в TeraBox, а не в браузере</div>
    </div>

    <!-- Основное приложение -->
    <div id="appScreen" style="display:none;">
        <div class="container">
            <!-- Навигация -->
            <nav class="nav" id="mainNav">
                <button class="active" data-screen="calendar">Календарь</button>
                <button data-screen="studies">Учебные материалы</button>
                <button data-screen="gallery">Фото</button>
                <button data-screen="books">Читательский дневник</button>
                <button data-screen="movies">Кинодневник</button>
                <button data-screen="logout" id="logoutBtn">Выход</button>
            </nav>

            <!-- Календарь -->
            <div id="screenCalendar" class="screen active">
                <div class="calendar-wrapper" id="calendarWrapper">
                    <!-- Заполняется из calendar.js -->
                </div>
            </div>

            <!-- Учебные материалы -->
            <div id="screenStudies" class="screen">
                <div class="studies-header">
                    <h2>Учебные материалы</h2>
                    <div class="studies-nav">
                        <button class="active" data-study="matematika">Математика</button>
                        <button data-study="filosofiya">Философия</button>
                        <button data-study="yazyki">Языкознание</button>
                    </div>
                </div>
                <div id="studiesContent" class="studies-content"></div>
            </div>

            <!-- Галерея фото -->
            <div id="screenGallery" class="screen">
                <div class="gallery-header">
                    <h2>Фото</h2>
                    <button id="addPhotoBtn">+ Добавить</button>
                </div>
                <div id="galleryGrid" class="gallery-grid"></div>
            </div>

            <!-- Читательский дневник -->
            <div id="screenBooks" class="screen">
                <div class="diary-header">
                    <h2>Читательский дневник</h2>
                    <button id="addBookBtn">+ Добавить</button>
                </div>
                <div id="booksDiary" class="diary-list"></div>
            </div>

            <!-- Кинодневник -->
            <div id="screenMovies" class="screen">
                <div class="diary-header">
                    <h2>Кинодневник</h2>
                    <button id="addMovieBtn">+ Добавить</button>
                </div>
                <div id="moviesDiary" class="diary-list"></div>
            </div>

            <!-- Страничка дня (модалка) -->
            <div id="dayModal" class="modal-overlay">
                <div class="modal">
                    <div class="modal-header">
                        <h3 id="dayModalTitle">18 августа 2026</h3>
                        <button class="close-btn" onclick="closeDayModal()">✕</button>
                    </div>
                    <div id="dayModalContent">
                        <!-- Заполняется из calendar.js -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно (общее) -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script src="js/terabox.js"></script>
    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/studies.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/books.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
