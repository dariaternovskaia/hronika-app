<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Хроника</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <!-- ШАПКА С НАВИГАЦИЕЙ -->
        <header class="header">
            <h1>Хроника</h1>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-section="calendar">Календарь</button>
                <button class="nav-tab" data-section="study">Учебные материалы</button>
                <button class="nav-tab" data-section="photo">Фото</button>
                <button class="nav-tab" data-section="reader">Читательский дневник</button>
                <button class="nav-tab" data-section="cinema">Кинодневник</button>
                <button class="nav-tab" data-section="exit">Выход</button>
            </nav>
        </header>

        <!-- КОНТЕЙНЕРЫ ДЛЯ РАЗДЕЛОВ -->
        <main class="main-content">
            <section id="section-calendar" class="section active">
                <div id="calendar"></div>
            </section>
            <section id="section-study" class="section">
                <h2>Учебные материалы</h2>
                <div id="studyContent"></div>
            </section>
            <section id="section-photo" class="section">
                <h2>Фото</h2>
                <div id="photoContent"></div>
            </section>
            <section id="section-reader" class="section">
                <h2>Читательский дневник</h2>
                <div id="readerContent"></div>
            </section>
            <section id="section-cinema" class="section">
                <h2>Кинодневник</h2>
                <div id="cinemaContent"></div>
            </section>
            <section id="section-exit" class="section">
                <h2>Выход</h2>
                <p>Вы вышли из приложения</p>
            </section>
        </main>
    </div>

    <!-- МОДАЛКА -->
    <div id="modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Челлендж</h2>
            <span class="badge" id="modalBadge">Задача</span>
            <p id="modalDesc">Описание</p>
            <div class="dates" id="modalDates"></div>
            <button class="modal-close" id="modalCloseBtn">Закрыть</button>
        </div>
    </div>

    <!-- ПОДКЛЮЧАЕМ СКРИПТЫ -->
    <script src="js/calendar.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/study.js"></script>
    <script src="js/photo.js"></script>
    <script src="js/reader.js"></script>
    <script src="js/cinema.js"></script>
</body>
</html>
